<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Three LUT-B scale layouts for one K64 by N8 compressed B tile</title>
  <desc id="desc">All three layouts use 512 three-bit indices and one shared eight-entry E4M3 lookup table. The first uses eight K64 per-column scales and one MMA. The second uses sixteen per-column K32-half scales and two masked K64 MMA passes. The third is a descriptor-dependent target that multiplies activation-row and weight-column scales inside one block-scaled K64 MMA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f1"/>
      <stop offset="1" stop-color="#f4f1e4"/>
    </linearGradient>
    <linearGradient id="payload" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3a3323" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#817967"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, Arial, sans-serif; fill: #23211b; }
      .subtitle { font: 500 17px Inter, Arial, sans-serif; fill: #6e6a5c; }
      .panel-title { font: 700 20px Inter, Arial, sans-serif; fill: #2e2b23; }
      .label { font: 700 15px Inter, Arial, sans-serif; fill: #2e2b23; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #5f5b4d; }
      .tiny { font: 500 11.5px Inter, Arial, sans-serif; fill: #736d5f; }
      .mono { font: 700 13px "JetBrains Mono", Menlo, monospace; fill: #2e2b23; }
      .mono-small { font: 600 11.5px "JetBrains Mono", Menlo, monospace; fill: #4b463d; }
      .white { fill: #fff; }
      .purple { fill: #5b21b6; }
      .teal { fill: #176b5b; }
      .gold { fill: #8a6a14; }
      .line { fill: none; stroke: #817967; stroke-width: 1.6; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 1.8; marker-end: url(#arrowPurple); }
      .panel { fill: #fffdf6; stroke: #cfc8b2; stroke-width: 1.5; }
      .neutral { fill: #f1eee4; stroke: #b8b09c; stroke-width: 1.3; }
      .lut { fill: url(#payload); stroke: #7c3aed; stroke-width: 1.7; }
      .k64 { fill: #d8eee7; stroke: #2c7a6b; stroke-width: 1.2; }
      .k32a { fill: #f4e7af; stroke: #a97f19; stroke-width: 1.2; }
      .k32b { fill: #f2d6bd; stroke: #b76732; stroke-width: 1.2; }
      .masked { fill: #d9d5ca; stroke: #9b9483; stroke-width: 1.2; }
      .target { fill: #eee7fb; stroke: #7c3aed; stroke-width: 1.5; }
      .badge-green { fill: #e7f3ee; stroke: #2c7a6b; stroke-width: 1.2; }
      .badge-gold { fill: #f8efd4; stroke: #a97f19; stroke-width: 1.2; }
      .badge-purple { fill: #eee7fb; stroke: #7c3aed; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="title">Who shares the LUT, and who shares each scale?</text>
  <text x="48" y="86" class="subtitle">One K64 &#215; N8 B tile &#183; same 512 indices and 8-entry LUT &#183; three scale schedules</text>

  <!-- Common payload -->
  <rect x="44" y="112" width="1512" height="126" rx="18" class="panel" filter="url(#shadow)"/>
  <rect x="72" y="148" width="270" height="58" rx="11" class="lut"/>
  <text x="207" y="172" class="label purple" text-anchor="middle">512 &#215; 3-bit index</text>
  <text x="207" y="193" class="small" text-anchor="middle">one K64 &#215; N8 compressed tile</text>
  <path d="M342 177 H402" class="purple-line"/>
  <rect x="403" y="140" width="286" height="74" rx="12" class="lut"/>
  <text x="546" y="169" class="label purple" text-anchor="middle">one shared LUT</text>
  <text x="546" y="191" class="small" text-anchor="middle">8 E4M3 values serve all 512 indices</text>
  <path d="M689 177 H749" class="line"/>
  <rect x="750" y="140" width="350" height="74" rx="12" class="neutral"/>
  <text x="925" y="169" class="label" text-anchor="middle">only scale ownership changes</text>
  <text x="925" y="191" class="small" text-anchor="middle">K64 per column &#183; K32 per column/half</text>
  <path d="M1100 177 H1160" class="line"/>
  <rect x="1161" y="140" width="365" height="74" rx="12" class="neutral"/>
  <text x="1343" y="169" class="label" text-anchor="middle">optional tensor-global g</text>
  <text x="1343" y="191" class="small" text-anchor="middle">one FP32 value, shared by the whole tensor</text>

  <!-- Panel 1 -->
  <rect x="44" y="270" width="484" height="770" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="70" y="310" class="panel-title">1 &#183; Native K64 scales</text>
  <text x="70" y="334" class="small">current one-pass quality/performance path</text>
  <text x="294" y="365" class="tiny" text-anchor="middle">K = 0 ... 63</text>

  <text x="80" y="397" class="tiny">n0</text>
  <rect x="105" y="379" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="396" class="mono-small" text-anchor="middle">sB[0] &#183; 64 weights</text>
  <text x="80" y="425" class="tiny">n1</text>
  <rect x="105" y="407" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="424" class="mono-small" text-anchor="middle">sB[1]</text>
  <text x="80" y="453" class="tiny">n2</text>
  <rect x="105" y="435" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="452" class="mono-small" text-anchor="middle">sB[2]</text>
  <text x="80" y="481" class="tiny">n3</text>
  <rect x="105" y="463" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="480" class="mono-small" text-anchor="middle">sB[3]</text>
  <text x="80" y="509" class="tiny">n4</text>
  <rect x="105" y="491" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="508" class="mono-small" text-anchor="middle">sB[4]</text>
  <text x="80" y="537" class="tiny">n5</text>
  <rect x="105" y="519" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="536" class="mono-small" text-anchor="middle">sB[5]</text>
  <text x="80" y="565" class="tiny">n6</text>
  <rect x="105" y="547" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="564" class="mono-small" text-anchor="middle">sB[6]</text>
  <text x="80" y="593" class="tiny">n7</text>
  <rect x="105" y="575" width="392" height="24" rx="4" class="k64"/>
  <text x="301" y="592" class="mono-small" text-anchor="middle">sB[7]</text>

  <rect x="74" y="620" width="424" height="58" rx="11" class="badge-green"/>
  <text x="286" y="645" class="label teal" text-anchor="middle">8 scales &#183; each owns K64 &#215; N1</text>
  <text x="286" y="665" class="small" text-anchor="middle">the LUT still owns the whole 512-index tile</text>

  <rect x="74" y="704" width="424" height="82" rx="12" class="neutral"/>
  <text x="286" y="733" class="mono" text-anchor="middle">Bq = LUT[index]</text>
  <text x="286" y="760" class="mono" text-anchor="middle">D = MMA(Aq, Bq)</text>
  <path d="M286 786 V817" class="line"/>
  <rect x="74" y="818" width="424" height="78" rx="12" class="k64"/>
  <text x="286" y="849" class="mono" text-anchor="middle">&#916;Y[m,n] = g &#183; sA[m] &#183; sB[n] &#183; D</text>
  <text x="286" y="876" class="small" text-anchor="middle">scale once after the K64 partial</text>
  <rect x="74" y="923" width="424" height="60" rx="12" class="badge-green"/>
  <text x="286" y="949" class="label teal" text-anchor="middle">1 &#215; K64 LUT-B MMA</text>
  <text x="286" y="970" class="small" text-anchor="middle">208 logical bytes &#183; 3.25 bit/weight</text>

  <!-- Panel 2 -->
  <rect x="558" y="270" width="484" height="770" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="584" y="310" class="panel-title">2 &#183; K32 scales via masking</text>
  <text x="584" y="334" class="small">current exact two-pass realization</text>
  <text x="700" y="365" class="tiny" text-anchor="middle">K = 0 ... 31</text>
  <text x="900" y="365" class="tiny" text-anchor="middle">K = 32 ... 63</text>

  <text x="594" y="397" class="tiny">n0</text>
  <rect x="619" y="379" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="379" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="396" class="mono-small" text-anchor="middle">sB[0,0]</text>
  <text x="913" y="396" class="mono-small" text-anchor="middle">sB[0,1]</text>
  <text x="594" y="425" class="tiny">n1</text>
  <rect x="619" y="407" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="407" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="424" class="mono-small" text-anchor="middle">sB[1,0]</text>
  <text x="913" y="424" class="mono-small" text-anchor="middle">sB[1,1]</text>
  <text x="594" y="453" class="tiny">n2</text>
  <rect x="619" y="435" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="435" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="452" class="mono-small" text-anchor="middle">sB[2,0]</text>
  <text x="913" y="452" class="mono-small" text-anchor="middle">sB[2,1]</text>
  <text x="594" y="481" class="tiny">n3</text>
  <rect x="619" y="463" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="463" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="480" class="mono-small" text-anchor="middle">sB[3,0]</text>
  <text x="913" y="480" class="mono-small" text-anchor="middle">sB[3,1]</text>
  <text x="594" y="509" class="tiny">n4</text>
  <rect x="619" y="491" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="491" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="508" class="mono-small" text-anchor="middle">sB[4,0]</text>
  <text x="913" y="508" class="mono-small" text-anchor="middle">sB[4,1]</text>
  <text x="594" y="537" class="tiny">n5</text>
  <rect x="619" y="519" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="519" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="536" class="mono-small" text-anchor="middle">sB[5,0]</text>
  <text x="913" y="536" class="mono-small" text-anchor="middle">sB[5,1]</text>
  <text x="594" y="565" class="tiny">n6</text>
  <rect x="619" y="547" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="547" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="564" class="mono-small" text-anchor="middle">sB[6,0]</text>
  <text x="913" y="564" class="mono-small" text-anchor="middle">sB[6,1]</text>
  <text x="594" y="593" class="tiny">n7</text>
  <rect x="619" y="575" width="196" height="24" rx="4" class="k32a"/>
  <rect x="815" y="575" width="196" height="24" rx="4" class="k32b"/>
  <text x="717" y="592" class="mono-small" text-anchor="middle">sB[7,0]</text>
  <text x="913" y="592" class="mono-small" text-anchor="middle">sB[7,1]</text>

  <rect x="588" y="620" width="424" height="58" rx="11" class="badge-gold"/>
  <text x="800" y="645" class="label gold" text-anchor="middle">16 scales &#183; each owns K32 &#215; N1</text>
  <text x="800" y="665" class="small" text-anchor="middle">same single LUT across both K32 halves</text>

  <rect x="588" y="704" width="424" height="64" rx="12" class="neutral"/>
  <rect x="607" y="720" width="164" height="30" rx="6" class="k32a"/>
  <rect x="771" y="720" width="72" height="30" rx="6" class="masked"/>
  <text x="689" y="741" class="mono-small" text-anchor="middle">A0</text>
  <text x="807" y="741" class="mono-small" text-anchor="middle">zero</text>
  <text x="924" y="741" class="mono-small" text-anchor="middle">&#8594; D0</text>
  <rect x="588" y="778" width="424" height="64" rx="12" class="neutral"/>
  <rect x="607" y="794" width="72" height="30" rx="6" class="masked"/>
  <rect x="679" y="794" width="164" height="30" rx="6" class="k32b"/>
  <text x="643" y="815" class="mono-small" text-anchor="middle">zero</text>
  <text x="761" y="815" class="mono-small" text-anchor="middle">A1</text>
  <text x="924" y="815" class="mono-small" text-anchor="middle">&#8594; D1</text>
  <rect x="588" y="860" width="424" height="74" rx="12" class="badge-gold"/>
  <text x="800" y="888" class="mono-small" text-anchor="middle">&#916;Y = g &#183; (sA0&#183;sB[n,0]&#183;D0</text>
  <text x="800" y="912" class="mono-small" text-anchor="middle">+ sA1&#183;sB[n,1]&#183;D1)</text>
  <rect x="588" y="950" width="424" height="42" rx="11" class="badge-gold"/>
  <text x="800" y="977" class="label gold" text-anchor="middle">2 &#215; masked K64 LUT-B MMA issues</text>

  <!-- Panel 3 -->
  <rect x="1072" y="270" width="484" height="770" rx="20" class="panel" filter="url(#shadow)"/>
  <text x="1098" y="310" class="panel-title">3 &#183; K32 scales via multiplication</text>
  <text x="1098" y="334" class="small">one-pass factorized block-scale target</text>
  <text x="1214" y="365" class="tiny" text-anchor="middle">K = 0 ... 31</text>
  <text x="1414" y="365" class="tiny" text-anchor="middle">K = 32 ... 63</text>

  <text x="1108" y="397" class="tiny">n0</text>
  <rect x="1133" y="379" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="379" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="396" class="mono-small" text-anchor="middle">sB[0,0]</text>
  <text x="1427" y="396" class="mono-small" text-anchor="middle">sB[0,1]</text>
  <text x="1108" y="425" class="tiny">n1</text>
  <rect x="1133" y="407" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="407" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="424" class="mono-small" text-anchor="middle">sB[1,0]</text>
  <text x="1427" y="424" class="mono-small" text-anchor="middle">sB[1,1]</text>
  <text x="1108" y="453" class="tiny">n2</text>
  <rect x="1133" y="435" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="435" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="452" class="mono-small" text-anchor="middle">sB[2,0]</text>
  <text x="1427" y="452" class="mono-small" text-anchor="middle">sB[2,1]</text>
  <text x="1108" y="481" class="tiny">n3</text>
  <rect x="1133" y="463" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="463" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="480" class="mono-small" text-anchor="middle">sB[3,0]</text>
  <text x="1427" y="480" class="mono-small" text-anchor="middle">sB[3,1]</text>
  <text x="1108" y="509" class="tiny">n4</text>
  <rect x="1133" y="491" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="491" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="508" class="mono-small" text-anchor="middle">sB[4,0]</text>
  <text x="1427" y="508" class="mono-small" text-anchor="middle">sB[4,1]</text>
  <text x="1108" y="537" class="tiny">n5</text>
  <rect x="1133" y="519" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="519" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="536" class="mono-small" text-anchor="middle">sB[5,0]</text>
  <text x="1427" y="536" class="mono-small" text-anchor="middle">sB[5,1]</text>
  <text x="1108" y="565" class="tiny">n6</text>
  <rect x="1133" y="547" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="547" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="564" class="mono-small" text-anchor="middle">sB[6,0]</text>
  <text x="1427" y="564" class="mono-small" text-anchor="middle">sB[6,1]</text>
  <text x="1108" y="593" class="tiny">n7</text>
  <rect x="1133" y="575" width="196" height="24" rx="4" class="k32a"/>
  <rect x="1329" y="575" width="196" height="24" rx="4" class="k32b"/>
  <text x="1231" y="592" class="mono-small" text-anchor="middle">sB[7,0]</text>
  <text x="1427" y="592" class="mono-small" text-anchor="middle">sB[7,1]</text>

  <rect x="1102" y="620" width="424" height="58" rx="11" class="badge-purple"/>
  <text x="1314" y="645" class="label purple" text-anchor="middle">same desired K32 &#215; N1 ownership</text>
  <text x="1314" y="665" class="small" text-anchor="middle">but scales are supplied as a separable product</text>

  <rect x="1098" y="706" width="118" height="54" rx="10" class="k32a"/>
  <text x="1157" y="738" class="mono-small" text-anchor="middle">sA[m,h]</text>
  <text x="1237" y="738" class="panel-title" text-anchor="middle">&#215;</text>
  <rect x="1262" y="706" width="118" height="54" rx="10" class="k32b"/>
  <text x="1321" y="738" class="mono-small" text-anchor="middle">sB[n,h]</text>
  <text x="1401" y="738" class="panel-title" text-anchor="middle">=</text>
  <rect x="1426" y="706" width="100" height="54" rx="10" class="target"/>
  <text x="1476" y="729" class="mono-small" text-anchor="middle">s_eff</text>
  <text x="1476" y="747" class="tiny" text-anchor="middle">[m,n,h]</text>
  <path d="M1314 760 V797" class="purple-line"/>
  <rect x="1102" y="798" width="424" height="78" rx="12" class="target"/>
  <text x="1314" y="829" class="mono" text-anchor="middle">&#916;Y = g &#183; &#931;h D_h &#183; s_eff[m,n,h]</text>
  <text x="1314" y="855" class="small" text-anchor="middle">two K32 contributions inside one legal K64 MMA</text>
  <rect x="1102" y="900" width="424" height="84" rx="12" class="badge-purple"/>
  <text x="1314" y="929" class="label purple" text-anchor="middle">1 &#215; block-scaled K64 LUT-B MMA target</text>
  <text x="1314" y="952" class="small" text-anchor="middle">requires the exact descriptor factorization</text>
  <text x="1314" y="972" class="tiny" text-anchor="middle">target, not the current general correctness path</text>

  <!-- Legend -->
  <rect x="180" y="1060" width="1240" height="40" rx="10" fill="#fffdf6" stroke="#cfc8b2"/>
  <rect x="214" y="1072" width="18" height="16" rx="3" class="lut"/>
  <text x="242" y="1085" class="tiny">shared index/LUT payload</text>
  <rect x="504" y="1072" width="18" height="16" rx="3" class="k64"/>
  <text x="532" y="1085" class="tiny">K64 scale ownership</text>
  <rect x="798" y="1072" width="18" height="16" rx="3" class="k32a"/>
  <rect x="818" y="1072" width="18" height="16" rx="3" class="k32b"/>
  <text x="846" y="1085" class="tiny">two K32 halves</text>
  <rect x="1074" y="1072" width="18" height="16" rx="3" class="masked"/>
  <text x="1102" y="1085" class="tiny">masked A half</text>
  <rect x="1270" y="1072" width="18" height="16" rx="3" class="target"/>
  <text x="1298" y="1085" class="tiny">one-pass target</text>
</svg>
