<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">W3A8 on Rubin LUT-B: offline payload construction and dense or routed runtime execution</title>
  <desc id="desc">Top band: BF16 weights are conditioned, fitted to an eight-value codebook, and packed as 3-bit LUT-B payloads. Bottom left: dense Qwen and Gemma linear layers multiply E4M3 activations by compressed weights. Bottom right: MiniMax routes tokens through compressed W13 and W2 expert matrices around a standard SwiGLU operation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f1"/>
      <stop offset="1" stop-color="#f4f1e4"/>
    </linearGradient>
    <linearGradient id="rubin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="payload" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3a3323" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8371"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, Arial, sans-serif; fill: #23211b; }
      .subtitle { font: 500 17px Inter, Arial, sans-serif; fill: #6e6a5c; }
      .panel-title { font: 700 22px Inter, Arial, sans-serif; fill: #2e2b23; }
      .band-title { font: 700 18px Inter, Arial, sans-serif; fill: #3d3a30; }
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #2e2b23; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #5f5b4d; }
      .tiny { font: 500 11.5px Inter, Arial, sans-serif; fill: #7a7565; }
      .vlabel { font: 700 16px Inter, Arial, sans-serif; fill: #4c1d95; }
      .vsmall { font: 500 13px Inter, Arial, sans-serif; fill: #5b21b6; }
      .vtiny { font: 600 12px Inter, Arial, sans-serif; fill: #6d28d9; }
      .glabel { font: 700 15px Inter, Arial, sans-serif; fill: #6b520f; }
      .gtiny { font: 500 11.5px Inter, Arial, sans-serif; fill: #8a6a14; }
      .mono { font: 700 15px "JetBrains Mono", Menlo, monospace; }
      .white { fill: #fff; }
      .line { fill: none; stroke: #8a8371; stroke-width: 1.6; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 1.8; marker-end: url(#arrowPurple); }
      .purple-trunk { fill: none; stroke: #7c3aed; stroke-width: 1.8; }
      .dash-line { fill: none; stroke: #a89f88; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .halo { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 5; }
      .nbox { fill: #faf8ef; stroke: #b6ae95; stroke-width: 1.5; }
      .nbox2 { fill: #f1eee0; stroke: #b6ae95; stroke-width: 1.5; }
      .vbox { fill: url(#payload); stroke: #7c3aed; stroke-width: 1.8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="title">W3A8 on Rubin LUT-B</text>
  <text x="48" y="86" class="subtitle">Offline payload construction | Dense and routed runtime paths</text>

  <!-- Offline payload construction -->
  <rect x="44" y="110" width="1512" height="230" rx="20" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="144" class="band-title">OFFLINE &#8212; build one payload per weight matrix</text>

  <rect x="70" y="178" width="190" height="78" rx="13" class="nbox2"/>
  <text x="165" y="221" class="label" text-anchor="middle">BF16 / FP16 W</text>
  <path d="M260 217 H310" class="line"/>

  <rect x="311" y="172" width="250" height="90" rx="14" fill="#f3edd9" stroke="#a97f19" stroke-width="1.6"/>
  <text x="436" y="209" class="glabel" text-anchor="middle">optional H64 / AWQ</text>
  <text x="436" y="236" class="small" text-anchor="middle">condition outliers</text>
  <path d="M561 217 H611" class="line"/>

  <rect x="612" y="162" width="330" height="110" rx="15" class="nbox"/>
  <text x="777" y="203" class="label" text-anchor="middle">fit 8-value E4M3 LUT</text>
  <text x="777" y="232" class="small" text-anchor="middle">LM &#183; RMS^2 &#183; Fisher &#183; GPTQ</text>
  <path d="M942 217 H992" class="purple-line"/>

  <rect x="993" y="156" width="530" height="122" rx="16" class="vbox"/>
  <text x="1258" y="195" class="vlabel" text-anchor="middle">3-bit W payload</text>
  <text x="1258" y="224" class="vsmall" text-anchor="middle">indices + LUT + scales</text>
  <text x="1258" y="251" class="vtiny" text-anchor="middle">3.25 bit/W (K64)</text>

  <rect x="311" y="292" width="1212" height="30" rx="8" fill="#f8f3e4" stroke="#d6c99e"/>
  <text x="917" y="312" class="gtiny" text-anchor="middle">K64 scale &#183; K32-half scale &#183; optional global</text>

  <!-- Dense panel -->
  <rect x="44" y="370" width="736" height="422" rx="22" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="414" class="panel-title">Dense linears &#8212; Qwen / Gemma</text>

  <rect x="72" y="472" width="156" height="66" rx="12" class="nbox2"/>
  <text x="150" y="513" class="label" text-anchor="middle">BF16 A</text>
  <path d="M228 505 H268" class="line"/>

  <rect x="269" y="466" width="174" height="78" rx="13" class="nbox"/>
  <text x="356" y="500" class="label" text-anchor="middle">A8 online</text>
  <text x="356" y="526" class="small" text-anchor="middle">E4M3 + scale</text>
  <path d="M443 505 H482" class="line"/>

  <rect x="477" y="455" width="254" height="100" rx="16" class="halo"/>
  <rect x="484" y="462" width="240" height="86" rx="13" fill="url(#rubin)"/>
  <text x="604" y="500" class="mono white" text-anchor="middle">A x W3</text>
  <text x="604" y="529" class="small white" text-anchor="middle">LUT-B MMA</text>

  <path d="M1070 278 V350 H770 V505 H731" class="purple-line"/>
  <text x="915" y="342" class="vtiny" text-anchor="middle">B: packed W^T payload</text>

  <rect x="72" y="590" width="652" height="82" rx="13" class="nbox"/>
  <text x="398" y="630" class="label" text-anchor="middle">apply A x B scales</text>
  <text x="398" y="657" class="small" text-anchor="middle">optional global factor</text>
  <path d="M604 555 V590" class="line"/>

  <rect x="72" y="708" width="652" height="58" rx="12" class="nbox2"/>
  <text x="398" y="745" class="label" text-anchor="middle">linear output</text>
  <path d="M398 672 V708" class="line"/>

  <!-- MoE panel -->
  <rect x="820" y="370" width="736" height="422" rx="22" fill="#fffdf6" stroke="#cfc8b2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="848" y="408" class="panel-title">Routed experts &#8212; MiniMax</text>
  <text x="848" y="434" class="small">top 4 / 128 experts</text>

  <rect x="848" y="472" width="138" height="66" rx="12" class="nbox2"/>
  <text x="917" y="513" class="label" text-anchor="middle">hidden</text>
  <path d="M986 505 H1020" class="line"/>

  <rect x="1021" y="466" width="136" height="78" rx="13" class="nbox"/>
  <text x="1089" y="500" class="label" text-anchor="middle">route top-4</text>
  <text x="1089" y="526" class="small" text-anchor="middle">gather tokens</text>
  <path d="M1157 505 H1187" class="line"/>

  <rect x="1182" y="455" width="166" height="100" rx="16" class="halo"/>
  <rect x="1189" y="462" width="152" height="86" rx="13" fill="url(#rubin)"/>
  <text x="1265" y="500" class="label white" text-anchor="middle">A x W13</text>
  <text x="1265" y="529" class="small white" text-anchor="middle">LUT-B MMA</text>
  <path d="M1348 505 H1380" class="line"/>

  <rect x="1381" y="472" width="145" height="66" rx="12" class="nbox"/>
  <text x="1453" y="513" class="label" text-anchor="middle">SwiGLU</text>

  <path d="M1450 278 H1540 V700" class="purple-trunk"/>
  <path d="M1540 574 H1265 V555" class="purple-line"/>
  <text x="1396" y="566" class="vtiny" text-anchor="middle">B: W13 payload</text>

  <rect x="932" y="590" width="190" height="90" rx="16" class="halo"/>
  <rect x="939" y="597" width="176" height="76" rx="13" fill="url(#rubin)"/>
  <text x="1027" y="630" class="label white" text-anchor="middle">A x W2</text>
  <text x="1027" y="657" class="small white" text-anchor="middle">LUT-B MMA</text>
  <path d="M1453 538 V572 H1027 V590" class="line"/>
  <path d="M1540 700 H920 V646 H932" class="purple-line"/>
  <text x="1220" y="692" class="vtiny" text-anchor="middle">B: W2 payload</text>

  <rect x="1160" y="590" width="366" height="90" rx="13" class="nbox"/>
  <text x="1343" y="630" class="label" text-anchor="middle">weighted scatter</text>
  <text x="1343" y="657" class="small" text-anchor="middle">+ shared expert</text>
  <path d="M1122 635 H1160" class="line"/>

  <rect x="848" y="714" width="678" height="52" rx="12" class="nbox2"/>
  <text x="1187" y="747" class="label" text-anchor="middle">quality: codebook + scales &#183; speed: useful rows / 128</text>

  <!-- Legend -->
  <rect x="148" y="826" width="1304" height="48" rx="11" fill="#fffdf6" stroke="#cfc8b2"/>
  <rect x="176" y="842" width="16" height="16" rx="4" fill="url(#rubin)"/>
  <text x="200" y="855" class="tiny">LUT-B MMA</text>
  <rect x="390" y="842" width="16" height="16" rx="4" fill="url(#payload)" stroke="#7c3aed"/>
  <text x="414" y="855" class="tiny">3-bit payload</text>
  <rect x="680" y="842" width="16" height="16" rx="4" fill="#f3edd9" stroke="#a97f19"/>
  <text x="704" y="855" class="tiny">optional transform / scale</text>
  <rect x="1010" y="842" width="16" height="16" rx="4" class="nbox2"/>
  <text x="1034" y="855" class="tiny">standard operation</text>
  <circle cx="1272" cy="850" r="9" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1290" y="855" class="tiny">LUT-B execution</text>
</svg>
